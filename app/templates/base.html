<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Owngarnization — Aplicación minimalista de gestión de tareas y calendario con tablero de post-its.">
  <title>{% block title %}Owngarnization — Tareas y Calendario{% endblock %}</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Favicon & PWA Meta -->
  <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico?v=4">
  <link rel="icon" type="image/png" href="/static/img/logo.png?v=4">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#F5EFE6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Owngarnization">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/icons/apple-touch-icon-180.png?v=4">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="/static/css/styles.css">


  {% block extra_head %}{% endblock %}
</head>

<body>
  <!-- Contenedor global de Toasts/Notificaciones -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  {% block content %}{% endblock %}

  <!-- Scripts base -->
  <script src="/static/js/api.js"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
