{% extends "base.html" %}

{% block title %}Crear Cuenta — Owngarnization{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <a href="/" class="auth-logo-link" title="Owngarnization" aria-label="Owngarnization">
        <img src="/static/img/logo.png" alt="Owngarnization" class="auth-logo">
      </a>
      <p class="subtitle">Crea tu cuenta personal en segundos</p>
    </div>

    <div id="alert-box" class="alert-box" style="display: none;"></div>

    <form id="register-form" class="auth-form">
      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="ej. Sofia">
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña (mínimo 6 caracteres)</label>
        <input type="password" id="password" name="password" minlength="6" required autocomplete="new-password" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="password_confirm">Confirmar contraseña</label>
        <input type="password" id="password_confirm" name="password_confirm" minlength="6" required autocomplete="new-password" placeholder="••••••••">
        <div id="password-match-hint" class="password-match-hint empty" aria-live="polite"></div>
      </div>

      <div class="form-checkbox-group">
        <label class="checkbox-label" for="privacy_policy">
          <input type="checkbox" id="privacy_policy" name="privacy_policy" required>
          <span>He leído y acepto la <a href="/privacy" target="_blank" rel="noopener noreferrer">política de protección y privacidad de datos</a></span>
        </label>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary">Crear cuenta</button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes una cuenta? <a href="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById("register-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");
  const passwordInput = document.getElementById("password");
  const confirmInput = document.getElementById("password_confirm");
  const matchHint = document.getElementById("password-match-hint");
  const privacyCheck = document.getElementById("privacy_policy");

  function checkPasswordsMatch() {
    const pwd = passwordInput.value;
    const confirm = confirmInput.value;

    if (!pwd && !confirm) {
      matchHint.className = "password-match-hint empty";
      matchHint.textContent = "";
      return null;
    }

    if (!confirm) {
      matchHint.className = "password-match-hint empty";
      matchHint.textContent = "";
      return null;
    }

    if (pwd === confirm) {
      matchHint.className = "password-match-hint match";
      matchHint.textContent = "✓ Las contraseñas coinciden";
      return true;
    } else {
      matchHint.className = "password-match-hint no-match";
      matchHint.textContent = "✕ Las contraseñas no coinciden";
      return false;
    }
  }

  passwordInput.addEventListener("input", checkPasswordsMatch);
  confirmInput.addEventListener("input", checkPasswordsMatch);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.style.display = "none";

    const pwd = passwordInput.value;
    const confirm = confirmInput.value;

    if (pwd !== confirm) {
      alertBox.textContent = "Las contraseñas no coinciden. Por favor, verifícalas.";
      alertBox.style.display = "block";
      confirmInput.focus();
      return;
    }

    if (!privacyCheck.checked) {
      alertBox.textContent = "Debes aceptar la política de protección y privacidad de datos para registrarte.";
      alertBox.style.display = "block";
      privacyCheck.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Creando cuenta...";

    const payload = {
      username: form.username.value.trim(),
      email: form.email.value.trim(),
      password: pwd
    };

    try {
      const res = await fetch("/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || "Error al crear la cuenta");
      }
      window.location.href = "/";
    } catch (err) {
      alertBox.textContent = err.message;
      alertBox.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Crear cuenta";
    }
  });
</script>
{% endblock %}
