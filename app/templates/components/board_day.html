<!-- 1. VISTA DÍA (Tablero de Post-its) -->
<section id="view-day" class="view-section active view-animate-in" aria-label="Vista del día">
  <div class="day-board">
    <!-- Columna: Tareas Comunes (Rutinas diarias) -->
    <div class="board-column" id="column-common">
      <div class="column-header">
        <h3 class="column-title">
          <span class="column-icon">🔁</span> Tareas comunes
          <span class="column-badge" id="badge-common">0</span>
        </h3>
        <span class="column-subtitle">Rutinas que se repiten cada día</span>
      </div>
      <div class="postit-list" id="list-common" data-kind="common" aria-busy="true">
        <div class="postit-skeleton-card" aria-hidden="true">
          <div class="postit-skeleton-header">
            <div class="skeleton-block postit-skeleton-circle"></div>
            <div class="skeleton-block postit-skeleton-badge"></div>
          </div>
          <div class="skeleton-block postit-skeleton-title"></div>
          <div class="skeleton-block postit-skeleton-desc"></div>
          <div class="postit-skeleton-footer">
            <div class="skeleton-block postit-skeleton-time"></div>
            <div class="skeleton-block postit-skeleton-tag"></div>
          </div>
        </div>
        <div class="postit-skeleton-card" aria-hidden="true">
          <div class="postit-skeleton-header">
            <div class="skeleton-block postit-skeleton-circle"></div>
            <div class="skeleton-block postit-skeleton-badge"></div>
          </div>
          <div class="skeleton-block postit-skeleton-title" style="width: 68%;"></div>
          <div class="postit-skeleton-footer">
            <div class="skeleton-block postit-skeleton-time"></div>
            <div class="skeleton-block postit-skeleton-tag"></div>
          </div>
        </div>
      </div>
      <div class="empty-state" id="empty-common" style="display: none;">
        <p>No hay tareas comunes activas</p>
      </div>
    </div>

    <!-- Columna: Tareas del Día (Puntuales) -->
    <div class="board-column" id="column-daily">
      <div class="column-header">
        <h3 class="column-title">
          <span class="column-icon">📌</span> Tareas del día
          <span class="column-badge" id="badge-daily">0</span>
        </h3>
        <span class="column-subtitle">Tareas asignadas a esta fecha</span>
      </div>
      <div class="postit-list" id="list-daily" data-kind="daily" aria-busy="true">
        <div class="postit-skeleton-card" aria-hidden="true">
          <div class="postit-skeleton-header">
            <div class="skeleton-block postit-skeleton-circle"></div>
            <div class="skeleton-block postit-skeleton-badge"></div>
          </div>
          <div class="skeleton-block postit-skeleton-title"></div>
          <div class="skeleton-block postit-skeleton-desc"></div>
          <div class="postit-skeleton-footer">
            <div class="skeleton-block postit-skeleton-time"></div>
            <div class="skeleton-block postit-skeleton-tag"></div>
          </div>
        </div>
        <div class="postit-skeleton-card" aria-hidden="true">
          <div class="postit-skeleton-header">
            <div class="skeleton-block postit-skeleton-circle"></div>
            <div class="skeleton-block postit-skeleton-badge"></div>
          </div>
          <div class="skeleton-block postit-skeleton-title" style="width: 72%;"></div>
          <div class="postit-skeleton-footer">
            <div class="skeleton-block postit-skeleton-time"></div>
            <div class="skeleton-block postit-skeleton-tag"></div>
          </div>
        </div>
      </div>
      <div class="empty-state" id="empty-daily" style="display: none;">
        <p>No tienes tareas programadas para hoy</p>
        <button class="btn btn-outline-sm btn-quick-add">＋ Añadir tarea</button>
      </div>
    </div>
  </div>
</section>
