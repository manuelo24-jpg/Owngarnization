<!-- Banner de instalación de la App Móvil (PWA) -->
<div id="pwa-install-banner" class="pwa-install-banner" style="display: none;" role="region" aria-label="Instalar aplicación">
  <div class="pwa-banner-content">
    <img src="/static/img/icons/icon-192.png" alt="Owngarnization" class="pwa-banner-icon">
    <div class="pwa-banner-text">
      <strong class="pwa-banner-title">Instalar Owngarnization</strong>
      <p id="pwa-banner-desc" class="pwa-banner-desc">Añade la app a tu pantalla de inicio para acceso rápido y avisos.</p>
    </div>
  </div>
  <div class="pwa-banner-actions">
    <button id="btn-pwa-install" class="btn btn-primary btn-sm" style="display: none;">Instalar</button>
    <button id="btn-pwa-dismiss" class="btn-text" aria-label="Descartar aviso de instalación">✕</button>
  </div>
</div>
