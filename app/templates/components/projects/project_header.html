<!-- Cabecera del Módulo de Proyectos -->
<header class="app-header project-header">
  <div class="header-brand">
    <a href="{% if is_mobile %}/m/spaces{% else %}/spaces{% endif %}" class="brand-link" title="Ir al inicio (Espacios)" aria-label="Ir al inicio">
      <img src="/static/img/logo.png?v=4" alt="Owngarnization" class="app-logo">
    </a>
  </div>

  {% if project %}
  <!-- Selector Desplegable de Proyecto 1 a 1 -->
  <div class="project-dropdown">
    <button id="btn-project-dropdown" class="project-dropdown-btn" aria-haspopup="true" aria-expanded="false">
      <span class="project-header-icon">{{ project.icon or '📁' }}</span>
      <span class="project-current-name">{{ project.name }}</span>
      <span class="dropdown-caret">▾</span>
    </button>
    <div id="project-dropdown-menu" class="project-dropdown-menu">
      <div style="padding: 0.4rem 1rem; font-size: 0.75rem; color: var(--ink-muted); text-transform: uppercase;">
        Tus proyectos
      </div>
      {% if user_projects %}
        {% for p in user_projects %}
          <a href="{% if is_mobile %}/m/projects/{{ p.id }}{% else %}/projects/{{ p.id }}{% endif %}" class="project-dropdown-item {% if p.id == project.id %}active{% endif %}">
            <span>{{ p.icon or '📁' }}</span>
            <span>{{ p.name }}</span>
          </a>
        {% endfor %}
      {% endif %}
      <div class="project-dropdown-divider"></div>
      <a href="{% if is_mobile %}/m/projects{% else %}/projects{% endif %}" class="project-dropdown-item">
        <span>📋</span> Ver todos los proyectos
      </a>
      <a href="#" id="btn-new-project-dropdown" class="project-dropdown-item">
        <span>＋</span> Nuevo proyecto
      </a>
    </div>
  </div>
  {% endif %}

  <!-- Acciones de Cabecera -->
  <div class="header-actions">
    {% if project and project.my_permission != 'viewer' %}
    <button id="btn-project-new-task" class="btn btn-accent header-btn-new-task" title="Nueva tarea (N)">
      <span class="btn-icon">＋</span> Nueva tarea
    </button>
    {% endif %}

    <button id="btn-notifications" class="btn-guide-icon" title="Ajustes de avisos" aria-label="Ajustes de avisos">
      <span class="guide-qmark">🔔</span>
    </button>

    <button id="btn-guide" class="btn-guide-icon" title="Manual de usuario (?)" aria-label="Manual de usuario">
      <span class="guide-qmark">?</span>
    </button>

    <div class="user-profile">
      <span class="user-name header-user-name" title="{{ user.email }}">{{ user.username }}</span>
      <a href="/auth/logout" id="logout-btn" class="btn btn-outline-sm btn-logout-compact" title="Cerrar sesión">Salir</a>
    </div>
  </div>
</header>
