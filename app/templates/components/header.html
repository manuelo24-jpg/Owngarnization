<!-- Cabecera Principal -->
<header class="app-header">
  <div class="header-brand">
    <a href="/" class="brand-link" title="Owngarnization" aria-label="Owngarnization">
      <img src="/static/img/logo.png" alt="Owngarnization" class="app-logo">
    </a>
  </div>

  <!-- Buscador Global -->
  <div class="header-search">
    <div class="search-input-wrapper">
      <span class="search-icon">🔍</span>
      <input 
        type="search" 
        id="search-input" 
        placeholder="Buscar tareas (título o descripción)..." 
        autocomplete="off"
        aria-label="Buscar tareas"
      >
    </div>
  </div>

  <!-- Acciones y Menú de Usuario -->
  <div class="header-actions">
    <button id="btn-guide" class="btn-guide-icon" title="Manual de usuario y ayuda (?)" aria-label="Abrir manual de usuario">
      <span class="guide-qmark">?</span>
    </button>

    <button id="btn-new-task" class="btn btn-accent">
      <span class="btn-icon">＋</span> Nueva tarea
    </button>

    <div class="user-profile">
      <span class="user-name" title="{{ user.email }}">{{ user.username }}</span>
      <button id="logout-btn" class="btn btn-outline-sm" title="Cerrar sesión">Salir</button>
    </div>
  </div>
</header>
