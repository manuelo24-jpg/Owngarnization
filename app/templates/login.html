{% extends "base.html" %}

{% block title %}Iniciar Sesión — Owngarnization{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <a href="/" class="auth-logo-link" title="Owngarnization" aria-label="Owngarnization">
        <img src="/static/img/logo.png" alt="Owngarnization" class="auth-logo">
      </a>
      <p class="subtitle">Organiza tus días con claridad y calma</p>
    </div>

    <div id="alert-box" class="alert-box" style="display: none;"></div>

    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@correo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary">Iniciar sesión</button>
    </form>

    <div class="auth-footer">
      <p>¿No tienes cuenta? <a href="/register">Regístrate gratis</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const form = document.getElementById("login-form");
  const alertBox = document.getElementById("alert-box");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    alertBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Iniciando sesión...";

    const payload = {
      email: form.email.value.trim(),
      password: form.password.value
    };

    try {
      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || "Error al iniciar sesión");
      }
      window.location.href = "/";
    } catch (err) {
      alertBox.textContent = err.message;
      alertBox.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Iniciar sesión";
    }
  });
</script>
{% endblock %}
